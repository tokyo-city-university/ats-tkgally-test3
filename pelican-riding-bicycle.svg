<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>A pelican riding a bicycle</title>
  <!-- Sky and ground -->
  <rect width="800" height="600" fill="#cfeaff"/>
  <rect y="520" width="800" height="80" fill="#8fd17a"/>
  <circle cx="680" cy="110" r="45" fill="#ffe27a"/>

  <!-- Wheels -->
  <g fill="none" stroke="#222" stroke-width="10">
    <circle cx="250" cy="460" r="60"/>
    <circle cx="560" cy="460" r="60"/>
  </g>
  <g stroke="#999" stroke-width="2">
    <line x1="190" y1="460" x2="310" y2="460"/>
    <line x1="250" y1="400" x2="250" y2="520"/>
    <line x1="500" y1="460" x2="620" y2="460"/>
    <line x1="560" y1="400" x2="560" y2="520"/>
  </g>
  <circle cx="250" cy="460" r="6" fill="#444"/>
  <circle cx="560" cy="460" r="6" fill="#444"/>

  <!-- Bicycle frame -->
  <g stroke="#d62828" stroke-width="10" stroke-linecap="round" fill="none">
    <line x1="250" y1="460" x2="370" y2="460"/>
    <line x1="370" y1="460" x2="320" y2="330"/>
    <line x1="320" y1="330" x2="510" y2="330"/>
    <line x1="510" y1="330" x2="560" y2="460"/>
    <line x1="370" y1="460" x2="510" y2="335"/>
    <line x1="510" y1="330" x2="520" y2="295"/>
    <line x1="505" y1="295" x2="538" y2="295"/>
  </g>
  <!-- Saddle -->
  <path d="M300 322 Q325 308 350 322 L345 332 L305 332 Z" fill="#333"/>
  <!-- Pedal crank -->
  <circle cx="370" cy="460" r="10" fill="#444"/>
  <line x1="370" y1="460" x2="395" y2="480" stroke="#444" stroke-width="6" stroke-linecap="round"/>

  <!-- Pelican tail -->
  <path d="M320 290 L268 268 L282 312 L318 318 Z" fill="#7d8ea3"/>

  <!-- Pelican body -->
  <ellipse cx="395" cy="300" rx="100" ry="58" transform="rotate(-12 395 300)" fill="#f2f2f2" stroke="#555" stroke-width="3"/>
  <!-- Wing -->
  <path d="M330 290 Q380 240 455 262 Q410 300 360 318 Z" fill="#b8c4d1" stroke="#555" stroke-width="2"/>

  <!-- Legs and feet -->
  <g stroke="#f08c00" stroke-width="8" stroke-linecap="round" fill="none">
    <line x1="385" y1="352" x2="372" y2="440"/>
    <line x1="410" y1="352" x2="405" y2="440"/>
    <line x1="372" y1="440" x2="350" y2="446"/>
  </g>

  <!-- Neck -->
  <path d="M455 270 Q470 220 485 200" fill="none" stroke="#f2f2f2" stroke-width="34" stroke-linecap="round"/>

  <!-- Head -->
  <ellipse cx="500" cy="188" rx="32" ry="28" fill="#f2f2f2" stroke="#555" stroke-width="3"/>

  <!-- Beak and pouch -->
  <path d="M520 178 L640 210 Q636 222 620 224 L520 200 Z" fill="#f08c00" stroke="#a65c00" stroke-width="2"/>
  <path d="M528 200 Q580 230 600 226 Q592 262 560 258 Q532 240 520 214 Z" fill="#ffb84d" stroke="#a65c00" stroke-width="2"/>

  <!-- Eye -->
  <circle cx="508" cy="180" r="6" fill="#fff"/>
  <circle cx="510" cy="181" r="3.5" fill="#111"/>

  <!-- Motion lines -->
  <g stroke="#7aa6c9" stroke-width="5" stroke-linecap="round">
    <line x1="90" y1="400" x2="150" y2="400"/>
    <line x1="120" y1="440" x2="170" y2="440"/>
    <line x1="80" y1="480" x2="140" y2="480"/>
  </g>
</svg>
